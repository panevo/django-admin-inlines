[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-admin-inlines"
version = "1.2.0"
description = "django-admin-inlines adds actions to each row of the ModelAdmin or InlineModelAdmin. (A fork of django-inline-actions)"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Panevo Services Ltd.", email = "info@panevo.com" },
    { name = "Alexander Frenzel", email = "alex@relatedworks.com" },
    { name = "FENG Hao", email = "hiroshifuu@outlook.com" },
]
keywords = ["Django", "ModelAdmin", "inline", "actions"]
# No upper bounds: when a new release is excluded, package installers fall back to
# older versions of this package instead of reporting the incompatibility
requires-python = ">=3.10"
dependencies = [
    "Django>=4.2",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Environment :: Console",
    "Natural Language :: English",
    "Intended Audience :: Developers",
    "Topic :: Internet",
]

[project.urls]
Homepage = "https://github.com/panevo/django-admin-inlines"
Documentation = "https://github.com/panevo/django-admin-inlines/blob/master/README.md"
Changelog = "https://github.com/panevo/django-admin-inlines/blob/master/CHANGELOG.md"
Issues = "https://github.com/panevo/django-admin-inlines/issues"

[dependency-groups]
# Tools used by the pre-commit hooks and to run the tests
dev = [
    "autoflake>=1.4,<2",
    "black>=24.3,<25",
    "isort>=5.5.2,<6",
    "mypy",
    "pre-commit",
    "tox",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["inline_actions", "inline_actions.*"]

[tool.black]
line-length = 88
skip-string-normalization = true
target_version = ['py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
exclude = '''
(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
)
'''
