[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-admin-inlines"
version = "1.2.0"
description = "django-admin-inlines adds actions to each row of the ModelAdmin or InlineModelAdmin. (A fork of django-inline-actions)"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Panevo Services Ltd.", email = "info@panevo.com" },
    { name = "Alexander Frenzel", email = "alex@relatedworks.com" },
    { name = "FENG Hao", email = "hiroshifuu@outlook.com" },
]
keywords = ["Django", "ModelAdmin", "inline", "actions"]
# No upper bounds: when a new release is excluded, package installers fall back to
# older versions of this package instead of reporting the incompatibility
requires-python = ">=3.10"
dependencies = [
    "Django>=4.2",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Environment :: Console",
    "Natural Language :: English",
    "Intended Audience :: Developers",
    "Topic :: Internet",
]

[project.urls]
Homepage = "https://github.com/panevo/django-admin-inlines"
Documentation = "https://github.com/panevo/django-admin-inlines/blob/master/README.md"
Changelog = "https://github.com/panevo/django-admin-inlines/blob/master/CHANGELOG.md"
Issues = "https://github.com/panevo/django-admin-inlines/issues"

[dependency-groups]
test = [
    "coverage>=7.10",
    "django-webtest>=1.9",
    "lxml>=5.0",
    "pytest>=8",
    "pytest-django>=4.11",
    "pytest-mock>=3.3.1",
    "webob>=1.8.9",
]
lint = [
    "black>=24.3,<25",
    "isort>=5.5.2,<6",
    "mypy",
    "ruff",
]
# Everything needed for local development, including the pre-commit hooks
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    "autoflake>=1.4,<2",
    "pre-commit",
    "tox",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["inline_actions", "inline_actions.*"]

[tool.black]
line-length = 88
skip-string-normalization = true
target_version = ['py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
exclude = '''
(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
)
'''

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "test_proj.settings"
django_find_project = false
pythonpath = ["."]
testpaths = ["test_proj"]
addopts = "--durations=10"

[tool.coverage.run]
branch = true
parallel = true
source_pkgs = ["inline_actions"]

[tool.coverage.paths]
source = [
    "src/inline_actions",
    "*/site-packages/inline_actions",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __unicode__",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W"]
# Line length is handled by black
ignore = ["E501"]
