---
repos:
  - repo: local
    hooks:
      - id: black
        name: black
        language: system
        entry: black
        types: [python]
  
  - repo: local
    hooks:
      - id: autoflake
        name: autoflake
        language: system
        entry: autoflake --expand-star-imports --remove-all-unused-imports --remove-unused-variables --in-place --recursive test_proj/ src/
        types: [python]

  - repo: local
    hooks:
      - id: isort
        name: isort
        language: system
        entry: isort
        types: [python]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        language: system
        entry: mypy
        types: [python]

  # Temporarily disabled until flake8 is compatible with Python 3.13
