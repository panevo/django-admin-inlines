[tox]
requires = tox>=4.22
# Each Django version is tested on its oldest and newest supported Python version.
# Keep this list in sync with the matrix in .github/workflows/test.yml
envlist =
    py310-dj42
    py312-dj42
    py310-dj50
    py312-dj50
    py310-dj51
    py313-dj51
    py310-dj52
    py311-dj52
    py314-dj52
    py312-dj60
    py314-dj60
    py312-dj61
    py314-dj61
    lint

[testenv]
package = wheel
wheel_build_env = .pkg
dependency_groups = test
deps =
    dj42: Django>=4.2,<4.3
    dj50: Django>=5.0,<5.1
    dj51: Django>=5.1,<5.2
    dj52: Django>=5.2,<5.3
    dj60: Django>=6.0,<6.1
    dj61: Django>=6.1,<6.2
commands = coverage run -m pytest {posargs}

[testenv:lint]
skip_install = true
dependency_groups = lint
commands =
    black --check src test_proj
    isort --check-only src test_proj
    ruff check
    mypy src test_proj

[testenv:coverage]
skip_install = true
deps = coverage>=7.10
commands =
    coverage combine
    coverage report
