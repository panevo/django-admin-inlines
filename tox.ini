[gh-actions]
python =
  3.10: py310
  3.11: py311
  3.12: py312
  3.13: py313
  3.14: py314

[tox]
skipsdist = True
isolated_build = True
envlist =
  py310-{4.2,5.0,5.1,5.2}
  py311-{4.2,5.2}
  py312-{4.2,5.0,5.1,5.2,6.0,6.1}
  py313-{5.1,5.2,6.0,6.1}
  py314-{5.2,6.0,6.1}

[testenv]
skip_install = True
allowlist_externals =
  bash
  env
  grep
deps =
  pytest
  pytest-django
  pytest-cov
  pytest-mock
  webob
  django-webtest
  lxml>=5.0
  black
  better-exceptions
  4.2: Django>=4.2,<4.3
  5.0: Django>=5.0,<5.1
  5.1: Django>=5.1,<5.2
  5.2: Django>=5.2,<5.3
  6.0: Django>=6.0,<6.1
  6.1: Django>=6.1,<6.2
commands =
  # Run tests directly
  pytest --cov=inline_actions
  coverage report
